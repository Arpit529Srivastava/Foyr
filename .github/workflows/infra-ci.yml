name: Infra CI

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  workflow_dispatch:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Format
        run: tofu fmt -check -recursive infra
      - name: Validate and test
        run: |
          for dir in infra infra/bootstrap; do
            tofu -chdir=$dir init -backend=false -input=false
            tofu -chdir=$dir validate
            if ls $dir/*.tftest.hcl >/dev/null 2>&1; then tofu -chdir=$dir test; fi
          done
