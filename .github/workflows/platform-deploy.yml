name: Deploy platform

on:
  push:
    branches: [main]
    paths: ["cmd/**", "internal/**", "go.mod", "go.sum", ".github/workflows/platform-deploy.yml"]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a half-done one.
concurrency:
  group: deploy-platform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # short-lived AWS credentials through OIDC (ADR-031)

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::899628690655:role/foyr-github-deploy
  CLUSTER: foyr

jobs:
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests ran in Go CI before the merge; main is protected (ADR-017).
    # foyrd first: a new authproxy only turns healthy once foyrd answers its routes.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        service: [foyrd, authproxy]
    env:
      SERVICE: ${{ matrix.service }}
      FAMILY: foyr-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "cmd/$SERVICE/$SERVICE" "./cmd/$SERVICE"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Push image
        id: image
        run: |
          image="${{ steps.ecr.outputs.registry }}/foyr/$SERVICE:${GITHUB_SHA::12}"
          if aws ecr describe-images --repository-name "foyr/$SERVICE" --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "image exists (re-run)"
          else
            docker buildx build --platform linux/arm64 --provenance=false --push -t "$image" "cmd/$SERVICE"
          fi
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          # Latest revision with only the image swapped, so settings from tofu are kept.
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > td.json
          jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' td.json > new.json
          arn=$(aws ecs register-task-definition --cli-input-json file://new.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$arn" > /dev/null
          echo "Deploying $arn"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Live: $IMAGE"
