name: Deploy authproxy

on:
  push:
    branches: [main]
    paths: ["cmd/authproxy/**", "internal/proxy/**", "internal/obs/**", "internal/slug/**", "go.mod", "go.sum", ".github/workflows/authproxy-deploy.yml"]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a half-done one.
concurrency:
  group: deploy-authproxy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # short-lived AWS credentials through OIDC (ADR-031)

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::899628690655:role/foyr-github-deploy
  CLUSTER: foyr
  SERVICE: authproxy
  FAMILY: foyr-authproxy

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./cmd/authproxy/... ./internal/proxy/... ./internal/slug/...
      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o cmd/authproxy/authproxy ./cmd/authproxy
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Push image
        id: image
        run: |
          image="${{ steps.ecr.outputs.registry }}/foyr/authproxy:${GITHUB_SHA::12}"
          docker buildx build --platform linux/arm64 --provenance=false --push -t "$image" cmd/authproxy
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          # Latest revision with only the image swapped, so settings from tofu are kept.
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > td.json
          jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' td.json > new.json
          arn=$(aws ecs register-task-definition --cli-input-json file://new.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$arn" > /dev/null
          echo "Deploying $arn"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Live: $IMAGE"
