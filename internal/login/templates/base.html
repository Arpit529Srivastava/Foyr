{{define "head"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Sign in to Foyr</title><style>
:root{--bg:#000;--panel:#111;--line:#2a2a2a;--line2:#484848;--text:#eee;--dim:#a3a3a3;--a:#f5a524;--a2:#ffd27a;--bad:#e5484d;--r-lg:24px;--r-sm:999px}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(800px 380px at 50% -160px,#f5a52417,transparent 70%),var(--bg);min-height:100vh}
main{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px;letter-spacing:-.02em;margin-bottom:28px}.logo{width:30px;height:30px;display:block}
h1{font-size:28px;font-weight:500;letter-spacing:-.035em;margin:0}p{margin:8px 0 22px;color:var(--dim)}b{color:var(--text);font-weight:500}
form{display:grid;gap:12px}a{color:var(--a2)}
input{background:#000;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:var(--r-sm);background:var(--text);color:#000;border:0;font-weight:600;padding:12px}
.err{background:#1f0d0e;border:1px solid #5a1d20;color:#ffd1d3;border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:14px}
</style></head><body><main><div class="card"><div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges"><rect width="32" height="32" rx="7" fill="#191919"/><g fill="#eee" transform="translate(4 4) scale(1.5)"><rect x="2" y="1" width="12" height="2"/><rect x="2" y="3" width="2" height="12"/><rect x="12" y="3" width="2" height="12"/><rect x="5" y="4" width="4" height="11" fill="#f5a524"/></g></svg>foyr</div>
{{end}}
{{define "foot"}}</div></main></body></html>{{end}}
