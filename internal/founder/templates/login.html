{{define "login.html"}}{{template "head" .}}
<main class="gate"><div class="gate-box">
<div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges"><rect width="32" height="32" rx="7" fill="#191919"/><g fill="#eee" transform="translate(4 4) scale(1.5)"><rect x="2" y="1" width="12" height="2"/><rect x="2" y="3" width="2" height="12"/><rect x="12" y="3" width="2" height="12"/><rect x="5" y="4" width="4" height="11" fill="#f5a524"/></g></svg>foyr</div>
<h1>Founder sign in</h1>
<p>Paste your founder key. Run <span class="sha">scripts/founder-key.sh</span> to copy it.</p>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="/founder/login">
<input name="key" type="password" autocomplete="current-password" required autofocus aria-label="Founder key" placeholder="Founder key">
<button>Sign in</button></form></div></main>
{{template "foot"}}{{end}}
