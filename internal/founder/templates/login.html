{{define "login.html"}}{{template "head" .}}
<p class="k">Foyr · founder</p><h1>Sign in</h1>
<p class="dim">Paste the founder key. <span class="m">scripts/founder-key.sh</span> copies it to your clipboard.</p>
{{if .Error}}<p class="fail">{{.Error}}</p>{{end}}
<form method="post" action="/founder/login" style="display:flex;gap:8px;max-width:520px;margin-top:16px">
<input name="key" type="password" autocomplete="current-password" required autofocus aria-label="Founder key"
 style="flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit">
<button style="color:var(--text)">Sign in</button></form>
{{template "foot"}}{{end}}
