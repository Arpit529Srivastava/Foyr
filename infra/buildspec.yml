version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"
      - git clone --depth 1 "$REPO_URL" "$CODEBUILD_SRC_DIR/src"
      - git -C "$CODEBUILD_SRC_DIR/src" fetch --depth 1 origin "$COMMIT"
      - git -C "$CODEBUILD_SRC_DIR/src" checkout "$COMMIT"
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/src"
      - if [ ! -f Dockerfile ]; then echo "No Dockerfile found; the Next.js template arrives in step 6"; exit 1; fi
      - docker build --platform linux/amd64 -t "$IMAGE_URI" .
  post_build:
    commands:
      - docker push "$IMAGE_URI"
